name: Build MRT1 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Verify project structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== app module ==="
          ls -la app/ || echo "no app dir"
          echo "=== settings.gradle ==="
          cat settings.gradle || echo "no settings.gradle"

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: List build outputs
        run: find . -name "*.apk" -type f

      - name: Sign APK
        run: |
          APK=$(find . -name "app-release-unsigned.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi
          echo "Signing: $APK"
          
          keytool -genkeypair -v \
            -keystore mrt1.keystore \
            -storepass android -keypass android \
            -alias mrt1 -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=MRT1,O=MRT,C=IR"
          
          APKSIGNER=$(find /usr/local/lib/android -name apksigner -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "Trying jarsigner"
            jarsigner -keystore mrt1.keystore -storepass android -keypass android "$APK" mrt1
          else
            echo "Using: $APKSIGNER"
            $APKSIGNER sign \
              --ks mrt1.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias mrt1 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              "$APK"
            $APKSIGNER verify "$APK" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRT1-APK
          path: '**/*.apk'
          if-no-files-found: error
